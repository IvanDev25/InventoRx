<div class="chat-fab" (click)="toggle()" [class.open]="isOpen" [title]="tr('fabTooltip')">
  <span *ngIf="!isOpen">💬</span>
  <span *ngIf="isOpen">×</span>
  <div class="badge" *ngIf="!isOpen">1</div>
  <div class="tooltip" *ngIf="!isOpen">{{ tr('fabTooltip') }}</div>
</div>

      <select [(ngModel)]="selectedLanguage" (ngModelChange)="onLanguageChange($event)">
        <option *ngFor="let l of languages" [ngValue]="l.code">{{ l.label }}</option>
      </select>
    </div>
  </div>

  <div class="chat-messages">
    <div *ngFor="let m of messages" class="message" [class.me]="m.sender === 'You'">
      <div class="bubble">
        <div class="sender">{{ m.sender }}</div>
        <div class="text">{{ m.text }}</div>
      </div>
    </div>

    <!-- Typing indicator -->
    <div class="message" *ngIf="isTyping">
      <div class="bubble">
        <div class="sender">Levi</div>
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>

  <div class="quick-replies">
    <button class="chip" *ngFor="let q of quickReplies" (click)="selectQuickReply(q)">{{ q }}</button>
  </div>

  <div class="chat-input">
    <input type="text" [(ngModel)]="inputText" (keyup.enter)="send()" [placeholder]="tr('inputPlaceholder')" />
    <button class="send-btn" (click)="send()">{{ tr('send') }}</button>
  </div>
  
  <div class="buy-coffee-footer">
    <button class="buy-coffee-btn" (click)="openBuyMeACoffee()" [title]="tr('buyCoffee')">
      <span class="coffee-icon">☕</span>
      <span>{{ tr('buyCoffee') }}</span>
    </button>
  </div>
</div>

<!-- QR Code Modal -->
<div class="qr-modal-backdrop" *ngIf="showQRModal" (click)="closeQRModal()">
  <div class="particles">
    <div class="particle" *ngFor="let i of [1,2,3,4,5,6,7,8]"></div>
  </div>
</div>
<div class="qr-modal" *ngIf="showQRModal">
  <div class="qr-modal-header">
    <div class="qr-modal-title">{{ tr('buyCoffee') }}</div>
    <button class="qr-modal-close-btn" (click)="closeQRModal()">×</button>
  </div>
  <div class="qr-modal-body">
    <div class="qr-image-wrapper">
      <div class="qr-glow"></div>
      <img src="../../assets/qr.png" alt="QR Code" class="qr-image" />
    </div>
    <p class="qr-modal-text">Scan the QR code to support us! <span class="emoji-animate">☕</span></p>
  </div>
</div>
